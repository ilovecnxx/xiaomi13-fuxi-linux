# fuxi: wait for the lingering user manager before opening the graphical session.
# The distribution's session-c1.scope ordering does not start that scope.
[Unit]
Wants=user@1000.service
After=user@1000.service systemd-logind.service

[Service]
# Start the user's bus socket synchronously, without a guessed boot delay.
ExecStartPre=+/usr/bin/systemctl --user --machine=fuxi@.host start dbus.socket
# Do not run a TTY-opening control process concurrently with the main session:
# TTYVHangup=yes can otherwise hang up the just-started session.
ExecStartPost=
ExecStartPre=+/usr/bin/chvt 7
Environment=LIBSEAT_BACKEND=logind
