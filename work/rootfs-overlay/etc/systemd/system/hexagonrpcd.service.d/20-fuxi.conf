[Unit]
After=fuxi-firmware-devices.service
ConditionPathExists=/dev/fastrpc-adsp
ConditionPathExists=/var/lib/droid-juicer/sensors/socinfo/soc_id
ConditionPathExists=/var/lib/droid-juicer/sensors/sensors/sns_reg_version
ConditionPathExists=/var/lib/fuxi-sensors-prebuilt/sensors/registry/sns_reg_config

[Service]
ExecStart=
# Use Android's already-generated calibration registry. Empty configuration
# directories avoid asking the DSP to regenerate files through a read-only API.
ExecStart=/usr/local/libexec/hexagonrpcd-fuxi -f /dev/fastrpc-adsp -d adsp -s -R /var/lib/fuxi-sensors-prebuilt
