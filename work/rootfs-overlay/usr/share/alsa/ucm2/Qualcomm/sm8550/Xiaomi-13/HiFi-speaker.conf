# Tested bring-up levels: digital -30 dB; analog raw 5 matches vendor direct-ASP handset.
# Speaker protection/calibration is not yet integrated.
SectionVerb {
    # AudioReach needs the backend route before PipeWire probes the PCM.
    EnableSequence [
        cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia1' 1,1"
    ]
    DisableSequence [
        cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia1' 0,0"
        cset "name='B Digital PCM Volume' 0"
        cset "name='T Digital PCM Volume' 0"
    ]
    Value { TQ "HiFi" }
}

SectionDevice."Speaker" {
    Comment "Stereo speakers (conservative bring-up volume)"
    EnableSequence [
        cset "name='RCV MUX' Speaker"
        cset "name='B PCM Source' ASP"
        cset "name='T PCM Source' ASP"
        cset "name='B Digital PCM Volume' 577"
        cset "name='T Digital PCM Volume' 577"
        cset "name='B Analog PCM Volume' 5"
        cset "name='T Analog PCM Volume' 5"
    ]
    DisableSequence [
        cset "name='B Digital PCM Volume' 0"
        cset "name='T Digital PCM Volume' 0"
    ]
    Value {
        PlaybackChannels 2
        PlaybackPriority 100
        PlaybackPCM "hw:${CardId},0"
        PlaybackMixer "default:${CardId}"
    }
}
