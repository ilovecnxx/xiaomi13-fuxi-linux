SectionVerb {
	EnableSequence [
		cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	ConflictingDevice [
		"Earpiece"
	]

	# 与 HiFi-speaker.conf 相同的实测可听电平（数字 577 = -30 dB，模拟 raw 5）；保护/标定未接入
	EnableSequence [
		cset "name='RCV MUX' Speaker"
		cset "name='B PCM Source' ASP"
		cset "name='T PCM Source' ASP"
		cset "name='B Digital PCM Volume' 577"
		cset "name='T Digital PCM Volume' 577"
		cset "name='B Analog PCM Volume' 5"
		cset "name='T Analog PCM Volume' 5"
	]

	DisableSequence [
		cset "name='B Digital PCM Volume' 0"
		cset "name='T Digital PCM Volume' 0"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones Playback"

	Include.wcdhpe.File "/codecs/wcd938x/HeadphoneEnableSeq.conf"
	Include.wcdhpd.File "/codecs/wcd938x/HeadphoneDisableSeq.conf"
	Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "HP Digital"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Mic1" {
	Comment "Main Microphone"

	# WCD938x AMIC1 → ADC1 → TX SWR_INPUT0
	Include.wcdmice.File "/codecs/wcd938x/AnalogMic1EnableSeq.conf"
	Include.wcdmicd.File "/codecs/wcd938x/AnalogMic1DisableSeq.conf"
	Include.txmhpe.File "/codecs/qcom-lpass/tx-macro/SoundwireMic0EnableSeq.conf"
	Include.txmhpd.File "/codecs/qcom-lpass/tx-macro/SoundwireMicDisableSeq.conf"

	Value {
		CaptureChannels 2
		CapturePriority 200
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC1"
	}
}

SectionDevice."Mic2" {
	Comment "Second Microphone"

	# WCD938x AMIC5 → ADC4 (INP5) → TX SWR_INPUT1
	# 主线 qcom,tx-port-mapping=<2 2 3 4> 使 ADC_3_4_PORT（port 3）映射到物理 SWR 3；
	# ADC4 在 port 3 ch_mask BIT(1)，TX SMIC MUX0 选 SWR_MIC1 即可收到 ADC4 的输出（实测通过）。
	Include.wcdmice.File "/codecs/wcd938x/AnalogMic5EnableSeq.conf"
	Include.wcdmicd.File "/codecs/wcd938x/AnalogMic5DisableSeq.conf"
	Include.txmhpe.File "/codecs/qcom-lpass/tx-macro/SoundwireMic1EnableSeq.conf"
	Include.txmhpd.File "/codecs/qcom-lpass/tx-macro/SoundwireMicDisableSeq.conf"

	Value {
		CaptureChannels 2
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC4"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece（上扬声器 T 切到听筒模式，GPIO68；下扬声器 B 静音）"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='RCV MUX' Earpiece"
		cset "name='B Digital PCM Volume' 0"
	]

	DisableSequence [
		cset "name='RCV MUX' Speaker"
		cset "name='B Digital PCM Volume' 577"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},0"
	}
}
