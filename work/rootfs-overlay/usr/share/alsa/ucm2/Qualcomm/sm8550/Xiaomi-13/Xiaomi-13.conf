# Select only the interfaces actually registered by this kernel variant.
Syntax 4

If.wcd {
    Condition {
        Type ControlExists
        Control "name='ADC1 Volume'"
    }
    True.Include.wcd.File "/Qualcomm/sm8550/Xiaomi-13/Xiaomi-13-wcd.conf"
    False.Include.speaker.File "/Qualcomm/sm8550/Xiaomi-13/Xiaomi-13-speaker.conf"
}
