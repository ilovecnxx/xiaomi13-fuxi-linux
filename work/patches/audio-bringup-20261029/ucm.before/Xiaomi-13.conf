# Xiaomi 13 (fuxi)，主线声卡 "Xiaomi-13"（xiaomi,fuxi-sndcard，driver sm8550）
# 扬声器：2× CS35L41（B 下 / T 上）经 Secondary MI2S，功放直通（不加载 Cirrus DSP 固件），音量先压低保护扬声器。
# 麦克风：WCD9385 模拟输入。AMIC1/AMIC3 对应哪个物理麦克风待上机确认。
Syntax 4

SectionUseCase."HiFi" {
	File "/Qualcomm/sm8550/Xiaomi-13/HiFi.conf"
	Comment "HiFi quality Music."
}

# Digital PCM Volume：0..913，每档 0.125 dB，0 = -102 dB、816 = 0 dB、913 = +12 dB；696 = -15 dB（直通无保护，先保守；驱动里上限 816）
BootSequence [
	cset "name='B PCM Source' ASP"
	cset "name='T PCM Source' ASP"
	cset "name='B Digital PCM Volume' 696"
	cset "name='T Digital PCM Volume' 696"
	cset "name='B Analog PCM Volume' 0"
	cset "name='T Analog PCM Volume' 0"
	cset "name='HPHL Volume' 20"
	cset "name='HPHR Volume' 20"
	cset "name='ADC1 Volume' 10"
	cset "name='ADC2 Volume' 10"
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd938x/init.conf"
Include.rxm-init.File "/codecs/qcom-lpass/rx-macro/init.conf"
