<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手机截图</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --card2: #1d212a;
    --line: #2a2f3a;
    --fg: #e8ecf3;
    --dim: #8b93a7;
    --accent: #4c8dff;
    --ok: #35c46a;
    --err: #ff5d5d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 15px/1.45 "Noto Sans CJK SC", "Source Han Sans SC", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 18px 18px 40px; max-width: 980px; margin: 0 auto;
  }
  header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; letter-spacing: .5px; }
  #status { font-size: 13px; color: var(--dim); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--dim); margin-right: 6px; }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .row { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
  #shoot {
    width: 100%; min-height: 130px; border-radius: 14px; flex-direction: column; gap: 4px;
    border: 1px solid #3d63b5;
    background: linear-gradient(180deg, #2b5bd6, #2248ad);
    color: #fff; font-size: 30px; font-weight: 700; letter-spacing: 4px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 14px;
    transition: transform .06s, filter .15s;
    user-select: none;
  }
  #shoot:hover { filter: brightness(1.08); }
  #shoot:active { transform: scale(.985); filter: brightness(.92); }
  #shoot[disabled] { filter: grayscale(.4) brightness(.7); cursor: progress; }
  #shoot .big { font-size: 30px; font-weight: 700; letter-spacing: 4px; }
  #shoot small { display: block; font-size: 12.5px; font-weight: 400; letter-spacing: 0; opacity: .8; }
  #shoot .kbd { font-size: 12px; font-weight: 400; letter-spacing: 0; opacity: .75; }
  input[type=text], select {
    background: var(--card2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 10px; padding: 11px 12px; font-size: 15px; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  #note { flex: 1 1 220px; }
  .btn {
    background: var(--card2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 10px; padding: 11px 14px; font-size: 14px; cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); }
  .muted { color: var(--dim); font-size: 12.5px; }
  #msg { min-height: 20px; margin: 4px 0 12px; font-size: 13.5px; color: var(--dim); word-break: break-all; }
  #msg.err { color: var(--err); }
  #msg.ok { color: var(--ok); }
  section { margin-top: 20px; }
  h2 { font-size: 13px; color: var(--dim); font-weight: 600; text-transform: none; margin: 0 0 10px; letter-spacing: .5px; }
  #preview { display: flex; gap: 16px; align-items: flex-start; }
  #preview img {
    width: 232px; max-width: 42vw; border-radius: 10px; border: 1px solid var(--line);
    background: #000; cursor: zoom-in; display: block;
  }
  #preview .meta { font-size: 13px; color: var(--dim); line-height: 1.9; }
  #preview .meta b { color: var(--fg); font-weight: 500; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 12px; }
  .thumb { background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 6px; text-align: center; cursor: pointer; }
  .thumb:hover { border-color: var(--accent); }
  .thumb img { width: 100%; border-radius: 6px; display: block; background: #000; }
  .thumb span { display: block; font-size: 11.5px; color: var(--dim); margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  label.chk { display: inline-flex; gap: 8px; align-items: center; color: var(--dim); font-size: 14px; cursor: pointer; }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  kbd { background: var(--card2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>📱 手机截图</h1>
  <div id="status"><span class="dot" id="dot"></span><span id="dir">连接中…</span></div>
</header>

<div class="card">
  <button id="shoot"><span class="big">📸 截图</span><small>点一下 = 抓手机屏 + 存电脑</small></button>
  <div class="row" style="margin-top:12px">
    <input id="note" type="text" placeholder="备注（可选，写进文件名，如：Wi-Fi设置）" maxlength="40">
    <button class="btn" id="folder">打开文件夹</button>
  </div>
</div>

<div id="msg">快捷键：<kbd>空格</kbd> / <kbd>回车</kbd> 截图；切到手机界面后按一下即可。</div>

<section>
  <h2>最新一张</h2>
  <div id="preview" class="card" style="display:none">
    <a id="plink" target="_blank" rel="noopener"><img id="pimg" alt="最新截图"></a>
    <div class="meta" id="pmeta"></div>
  </div>
  <div id="previewEmpty" class="muted">还没有截图。</div>
</section>

<section>
  <h2>连拍（抓动画/过场）</h2>
  <div class="toolbar">
    <label class="chk"><input type="checkbox" id="burst"> 开启连拍</label>
    <span class="muted">间隔</span>
    <select id="interval">
      <option value="1000">1 秒</option>
      <option value="2000" selected>2 秒</option>
      <option value="3000">3 秒</option>
      <option value="5000">5 秒</option>
    </select>
    <span class="muted" id="burstInfo"></span>
  </div>
</section>

<section>
  <h2>最近截图</h2>
  <div id="grid"></div>
</section>

<script>
const $ = (id) => document.getElementById(id);
const shootBtn = $("shoot"), msg = $("msg"), dirEl = $("dir"), dot = $("dot");
let busy = false, burstTimer = null;

function setMsg(text, kind = "") {
  msg.textContent = text;
  msg.className = kind;
}

async function api(path, payload) {
  const res = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload || {}),
    cache: "no-store",
  });
  return res.json();
}

function showPreview(shot) {
  $("preview").style.display = "flex";
  $("previewEmpty").style.display = "none";
  $("pimg").src = shot.url + "?t=" + Date.now();
  $("plink").href = shot.url;
  const kb = (shot.size / 1024).toFixed(0);
  $("pmeta").innerHTML =
    `<b>${shot.mtime}</b><br>${shot.name}<br>${kb} KB<br><span class="muted">点图看原图；文件在 ${shot.path}</span>`;
}

function renderList(shots) {
  const grid = $("grid");
  grid.innerHTML = "";
  for (const s of shots) {
    const el = document.createElement("div");
    el.className = "thumb";
    el.title = s.path;
    el.innerHTML = `<img loading="lazy" src="${s.url}?t=${s.ts}" alt=""><span>${s.mtime} ${s.name.replace(/^shot-\d{8}-\d{6}-?/, "")}</span>`;
    el.onclick = () => { showPreview(s); window.scrollTo({ top: 0, behavior: "smooth" }); };
    grid.appendChild(el);
  }
}

async function refresh() {
  try {
    const res = await fetch("/api/list", { cache: "no-store" });
    const data = await res.json();
    dirEl.textContent = "保存到 " + data.dir;
    dot.classList.add("on");
    renderList(data.shots);
    if (data.shots.length && $("preview").style.display === "none") showPreview(data.shots[0]);
  } catch (e) {
    dot.classList.remove("on");
    dirEl.textContent = "服务未连接";
  }
}

async function doShot(auto = false) {
  if (busy) return;
  busy = true;
  shootBtn.disabled = true;
  shootBtn.innerHTML = '<span class="big">⏳ 截图…</span><small>正在抓手机屏</small>';
  try {
    const note = $("note").value.trim();
    const res = await api("/api/shot", { note });
    if (res.ok) {
      showPreview(res.shot);
      setMsg("✅ 已保存：" + res.shot.path, "ok");
      await refresh();
    } else {
      setMsg("❌ " + res.error, "err");
      if (burstTimer) toggleBurst(false);
    }
  } catch (e) {
    setMsg("❌ 请求失败：" + e, "err");
  } finally {
    busy = false;
    shootBtn.disabled = false;
    shootBtn.innerHTML = '<span class="big">📸 截图</span><small>点一下 = 抓手机屏 + 存电脑</small>';
  }
}

function toggleBurst(on) {
  const box = $("burst");
  box.checked = on;
  if (burstTimer) { clearInterval(burstTimer); burstTimer = null; }
  if (on) {
    const ms = parseInt($("interval").value, 10);
    burstTimer = setInterval(() => doShot(true), ms);
    $("burstInfo").textContent = `连拍中，每 ${ms / 1000} 秒一张`;
    setMsg("连拍中… 再点一下“开启连拍”可停止");
  } else {
    $("burstInfo").textContent = "";
    setMsg("已停止连拍。");
  }
}

shootBtn.onclick = () => doShot();
$("folder").onclick = async () => {
  const res = await api("/api/folder", {});
  if (!res.ok) setMsg("❌ " + res.error, "err");
};
$("burst").onchange = (e) => toggleBurst(e.target.checked);
$("interval").onchange = () => { if (burstTimer) toggleBurst(true); };

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.target.tagName === "TEXTAREA") return;
  if (e.code === "Space" || e.key === "Enter") {
    e.preventDefault();
    doShot();
  }
});

refresh();
setInterval(() => { if (!burstTimer) refresh(); }, 15000);
</script>
</body>
</html>
